[package]
name = "data-generator"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { workspace = true }
rayon = "1.9.0"
color-eyre = { workspace = true }
eyre = { workspace = true }
bincode = "1.3.3"

crypto = { path = "../crypto" }

base64 = "0.21.0"

ark-std = { version = "0.5.0", features = ["std", "getrandom"] }
ark-ff = "0.5.0"
ark-ec = "0.5.0"
ark-serialize = { version = "0.5.0", default-features = false, features = ["derive"] }
ark-ed-on-bls12-381 = { version = "0.5.0", default-features = false, features = ["r1cs"] }

ark-bls12-381 = { version = "0.5.0", default-features = false, features = ["curve"] }
ark-groth16 = "0.5.0"
ark-relations = "0.5.1"
ark-r1cs-std = "0.5.0"

serde = { workspace = true, version = "1.0.0", features = ["derive"] }

ark-crypto-primitives = { version = "0.5.0", default-features = false, features = ["crh", "sponge", "merkle_tree", "r1cs", "encryption"] }
thiserror = "2.0.17"
futures = "0.3.28"
chrono = "0.4.42"
serde_json = "1.0.96"
serde_yaml = "0.9.34+deprecated"
tokio = { version = "1", features = ["full"] }
aws-config = "1.1"
aws-sdk-ec2 = "~1.138.0"
aws-sdk-globalaccelerator = "~1.15.0"
shellexpand = "3.0"
