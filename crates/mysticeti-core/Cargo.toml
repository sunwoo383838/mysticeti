[package]
name = "mysticeti-core"
version = "0.1.0"
edition = "2021"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
axum = "0.6.18"
bincode = "1.3.3"
dirs-next = "2.0"

crypto = { path = "../crypto" }


ark-std = { version = "0.5.0", features = ["std", "getrandom"] }
ark-ff = "0.5.0"
ark-ec = "0.5.0"
ark-serialize = { version = "0.5.0", default-features = false, features = ["derive"] }
ark-ed-on-bls12-381 = { version = "0.5.0", default-features = false, features = ["r1cs"] }

ark-bls12-381 = { version = "0.5.0", default-features = false, features = ["curve"] }
ark-groth16 = "0.5.0"
ark-relations = "0.5.1"
ark-r1cs-std = "0.5.0"

ark-crypto-primitives = { version = "0.5.0", features = ["std", "crh", "sponge", "merkle_tree", "r1cs", "encryption"] }
thiserror = "2.0.17"

rocksdb = { version = "0.22.0" }

blake2 = "0.10.6"
crc32fast = "1.3.2"
digest = "0.10.6"
ed25519-consensus = "2.1.0"
eyre = { workspace = true }
futures = { workspace = true }
gettid = "0.1.2"
hex = "0.4.3"
hyper = "0.14.26"
libc = "0.2.146"
memmap2 = "0.7.0"

minibytes = { path = "../third-party/minibytes", default_features = false, features = ["frommmap"] }
parking_lot = "0.12.1"
prometheus = "0.13.3"

rand = "0.8.5"
serde = { workspace = true, version = "1.0.0", features = ["derive"] }
serde_yaml = "0.9.21"
tabled = "0.12.2"
tempfile = { workspace = true } # todo - move to dev-dep
tokio = { workspace = true }
tracing = { workspace = true }
tracing-core = "0.1.31"
tracing-subscriber = "0.3.17"
zeroize = "1.6.0"
num_cpus = "1.17.0"

[dev-dependencies]
reqwest = { workspace = true }
seahash = "4.1.0"
tempdir = "0.3.7"
tracing-test = "0.2.4"

[features]
simulator = []
